server:
  address: 127.0.0.1
  port: 8088

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${CITYLEARN_DB_URL:jdbc:mysql://127.0.0.1:3306/citylearn?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai}
    username: ${CITYLEARN_DB_USER:citylearn}
    password: ${CITYLEARN_DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher

mybatis-plus:
  mapper-locations: classpath*:/mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

citylearn:
  file:
    image-base-path: ${CITYLEARN_IMAGE_PATH:../uploads/images}
    out-file-path: ${CITYLEARN_OUTPUT_PATH:../output}
    python-file-path: ${CITYLEARN_PYTHON_PATH:../citylearnpy}
  python:
    executable: ${CITYLEARN_PYTHON:python}
    aac-executable: "${CITYLEARN_AAC_PYTHON:E:/citylearn-work/envs/aac_madrl/Scripts/python.exe}"
